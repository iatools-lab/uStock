services:
  dashboard:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${UKIT_HTTP_PORT:-3011}:3000"
    environment:
      UKIT_CACHE_TTL_SECONDS: ${UKIT_CACHE_TTL_SECONDS:-60}
    volumes:
      - ./backend/.env:/app/backend/.env:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

