# Managed by ukit deploy.sh
<VirtualHost *:80>
    ServerName ustock.upowa.org
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    ProxyPass / http://127.0.0.1:3011/ connectiontimeout=5 timeout=120
    ProxyPassReverse / http://127.0.0.1:3011/
    ErrorLog ${APACHE_LOG_DIR}/ukit-error.log
    CustomLog ${APACHE_LOG_DIR}/ukit-access.log combined
</VirtualHost>
